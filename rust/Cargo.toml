[package]
name = "spekkio-support"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"] # rlib for wasm-pack test

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.70"
rustfft = "6.2.0"
wasm-bindgen = "0.2.93"

[dependencies.symphonia]
git = "https://github.com/pdeljanov/Symphonia"
branch = "dev-0.6" # for non-'static MediaSources
default-features = false
features = [
    "flac", "mp3", "vorbis",
    "wav", "aiff", "ogg",
]

[dependencies.web-sys]
version = "0.3.70"
features = [
    "console",
]
